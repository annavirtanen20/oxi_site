services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: oxi
      POSTGRES_USER: oxi
      POSTGRES_PASSWORD: oxi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oxi"]
      interval: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://oxi:oxi@db:5432/oxi
    # Local development: runserver serves static files and reloads on code changes.
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - media:/app/media

volumes:
  pgdata:
  media:
