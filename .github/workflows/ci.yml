# CI for oxi_site: checks every change and builds the image.
#
#   every push and pull request:  lint -> tests
#   push to develop or main:      + build the Docker image, push to GHCR tagged with the commit
#                                 + hand the image to deploy.yml:
#                                     develop -> staging     (repository variable STAGING_ENABLED = "true")
#                                     main    -> production  (repository variable DEPLOY_ENABLED = "true")
#
# The deployment itself lives in deploy.yml (also runnable by hand for a rollback).
# See deploy/DEPLOY.md.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "ruff>=0.6"
      - name: Lint
        run: ruff check --output-format=github .
      - name: Formatting
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oxi
          POSTGRES_PASSWORD: oxi
          POSTGRES_DB: oxi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oxi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://oxi:oxi@localhost:5432/oxi
      SECRET_KEY: ci-only-not-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Django checks
        run: |
          python manage.py check --fail-level WARNING
          python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest

  build:
    needs: [lint, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Image name and tag
        id: vars
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.image }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run --rm -e SECRET_KEY=x \
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }} \
            python manage.py check --deploy --fail-level ERROR

  # Deploy only after this commit's image is built and smoke-tested; the steps are in deploy.yml.
  deploy:
    needs: build
    if: >-
      (github.ref == 'refs/heads/develop' && vars.STAGING_ENABLED == 'true') ||
      (github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true')
    uses: ./.github/workflows/deploy.yml
    with:
      target: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      tag: ${{ needs.build.outputs.tag }}
    secrets: inherit
