<ol class="steps" aria-label="Booking steps">
  <li{% if step == 1 %} aria-current="step"{% elif step > 1 %} class="done"{% endif %}><span>{% if step > 1 %}✓{% else %}1{% endif %}</span>Service</li>
  <li{% if step == 2 %} aria-current="step"{% elif step > 2 %} class="done"{% endif %}><span>{% if step > 2 %}✓{% else %}2{% endif %}</span>Date and time</li>
  <li{% if step == 3 %} aria-current="step"{% endif %}><span>3</span>Your details</li>
</ol>
