[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, modern syntax, Django-specific checks
select = ["E", "F", "W", "I", "B", "UP", "DJ"]
ignore = [
    "DJ001",  # null=True on CharField: we don't use it, but Wagtail-style fields may
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.ruff.lint.per-file-ignores]
# Demo copy: long placeholder strings read better unwrapped.
"apps/pages/management/commands/seed_demo.py" = ["E501"]
